<!doctype html>
<html lang="zh-CN" data-theme="classic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b2822" />
    <title>叠映 · 创作工作台</title>
    <script>
      try {
        const t = localStorage.getItem('cine.appearance');
        if (['classic', 'field', 'cinema'].includes(t)) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="stylesheet" href="/studio.css" />
  </head>
  <body>
    <a href="#content" class="skip">跳至工作区</a>
    <div class="appShell">
      <aside class="rail" id="rail"></aside>
      <div class="mainShell">
        <header class="top" id="top"></header>
        <main id="content" tabindex="-1"><div class="empty">正在读取工作室…</div></main>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div role="status" aria-live="polite" id="notice"></div>
    <script type="module" src="/studio.js"></script>
  </body>
</html>
