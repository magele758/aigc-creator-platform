name: Regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install media tools and app dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm ci
      - name: API, agent tools and storage
        run: npm test
      - name: Frame, sound, model graphs and connector contracts
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s workers -p 'test_*.py' -v
      - name: Install browser for UI regression
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Browser workflow regression
        run: python web/tests/browser_smoke.py
